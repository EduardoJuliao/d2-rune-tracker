<div class="tracker-container">
  <h1>D2 Rune Tracker</h1>

  <div class="run-number-section">
    <label for="runNumber">Run Number:</label>
    <input
      type="number"
      id="runNumber"
      [(ngModel)]="runNumber"
      (change)="onRunNumberChange($event)"
      min="1"
      class="run-input">
    <button (click)="incrementRunNumber()" class="increment-btn">Next Run</button>

    <div class="storage-toggle">
      <label for="storageEnabled">
        <input
          type="checkbox"
          id="storageEnabled"
          [(ngModel)]="storageEnabled"
          (change)="onStorageToggle(storageEnabled)">
        Save Progress
      </label>
    </div>
  </div>

  <div class="runes-section">
    <div class="rune-row" *ngFor="let row of runeRows">
      <app-rune-card
        *ngFor="let rune of row"
        [rune]="rune"
        (increment)="incrementRune($event)"
        (decrement)="decrementRune($event)">
      </app-rune-card>
    </div>
  </div>

  <app-run-log
    [logEntries]="logEntries"
    [runes]="runes"
    [runCount]="runNumber - 1">
  </app-run-log>

  <!-- Craftable Runewords Section -->
  <div class="craftable-runewords-section" *ngIf="craftableRunewords.length > 0">
    <h2>Craftable Runewords ({{ craftableRunewords.length }})</h2>
    <div class="runewords-grid">
      <article *ngFor="let runeword of craftableRunewords" class="runeword-card">
        <h3 class="runeword-title">{{ runeword.name }}</h3>

        <h4 class="runeword-meta">
          <span class="patch-label">Patch 2.6</span>
          <span class="runeword-label">Runeword</span>
        </h4>

        <!-- Runes Section -->
        <div class="runes-list">
          <span *ngFor="let rune of runeword.runes; let i = index"
                class="rune-item"
                [class.rune-available]="isRuneInInventory(rune)">
            <i *ngIf="i > 0" class="arrow">▶</i>
            <img [src]="getRuneImage(rune)" [alt]="rune" class="rune-image">
            <span class="rune-name">{{ rune }}</span>
          </span>
        </div>

        <div class="runeword-requirements">
          <span class="level-req">Req level: {{ runeword.level }}</span>
        </div>

        <div class="divider"></div>

        <div class="runeword-info">
          <span class="sockets-info">{{ runeword.sockets }} socket</span>
          <span class="item-types">{{ runeword.itemTypes.join(', ') }}</span>
        </div>

        <div class="runeword-properties">
          <div *ngFor="let property of runeword.properties" class="property">
            {{ property }}
          </div>
        </div>
      </article>
    </div>
  </div>
</div>
