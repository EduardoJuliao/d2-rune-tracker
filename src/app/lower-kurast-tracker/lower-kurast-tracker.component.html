<div class="tracker-container">
  <h1>Lower Kurast Run Tracker</h1>

  <div class="run-number-section">
    <label for="runNumber">Run Number:</label>
    <input
      type="number"
      id="runNumber"
      [(ngModel)]="runNumber"
      (change)="onRunNumberChange($event)"
      min="1"
      class="run-input">
    <button (click)="incrementRunNumber()" class="increment-btn">Next Run</button>
  </div>

  <div class="runes-section">
    <div class="rune-row" *ngFor="let row of runeRows">
      <div class="rune-card" *ngFor="let rune of row">
        <img [src]="rune.image" [alt]="rune.name" class="rune-image">
        <div class="rune-info">
          <div class="rune-name">{{ rune.name }}</div>
          <div class="rune-counter">
            <button (click)="decrementRune(rune)" class="counter-btn">-</button>
            <span class="count">{{ rune.count }}</span>
            <button (click)="incrementRune(rune)" class="counter-btn">+</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="log-section">
    <div class="log-header">
      <h2>Run Log</h2>
      <button (click)="exportLog()" class="export-btn">Export Log</button>
    </div>
    <div class="log-container">
      <div class="log-entry" *ngFor="let entry of logEntries">
        Found {{ entry.count }} {{ entry.runeName }} rune{{ entry.count > 1 ? 's' : '' }} in run {{ entry.runNumber }}
      </div>
      <div *ngIf="logEntries.length === 0" class="no-entries">
        No runes found yet. Start tracking your runs!
      </div>
    </div>
  </div>
</div>
